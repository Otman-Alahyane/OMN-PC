<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OMN PC - Marketplace PC Gamer Pro & Composants</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #0A0A0A;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 1000px;
      height: 700px;
      background: radial-gradient(circle, rgba(217, 30, 41, 0.16) 0%, rgba(10, 10, 10, 0) 70%);
      border-radius: 50%;
      z-index: 0;
      pointer-events: none;
      animation: pulseGlow 5s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% {
        transform: translateX(-50%) scale(0.85);
        opacity: 0.5;
      }
      100% {
        transform: translateX(-50%) scale(1.15);
        opacity: 1;
      }
    }

    .bg-grid-pattern {
      background-size: 36px 36px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    }

    .led-particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(228, 32, 43, 0.6);
      box-shadow: 0 0 10px #E4202B, 0 0 20px #E4202B;
      animation: floatLed 8s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes floatLed {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
      50% { transform: translateY(-30px) scale(1.3); opacity: 0.8; }
    }
  </style>
</head>
<body class="bg-[#0A0A0A] text-[#F5F5F5] antialiased">

  <div class="led-particle w-2 h-2 top-20 left-[10%]" style="animation-delay: 0s;"></div>
  <div class="led-particle w-3 h-3 top-40 right-[10%]" style="animation-delay: 2s;"></div>
  <div class="led-particle w-1.5 h-1.5 top-96 left-[25%]" style="animation-delay: 4s;"></div>

  <div id="root" class="relative z-10"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const eur = new Intl.NumberFormat("fr-FR", {
      style: "currency",
      currency: "EUR",
      maximumFractionDigits: 0,
    });

    const display = { fontFamily: '"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif' };
    const bodyStyle = { fontFamily: '"DM Sans", ui-sans-serif, system-ui, sans-serif' };

    const inputCls = "w-full rounded-xl border border-[#333333] bg-[#0A0A0A]/80 backdrop-blur-md px-4 py-3.5 text-sm text-[#F5F5F5] placeholder:text-[#6B6B6B] focus:border-[#D91E29] focus:outline-none focus:ring-2 focus:ring-red-900/50 shadow-lg transition-all";

    const CSV_URL = 'configs.csv';

    const SPEC_ROWS = [
      ["cpu", "Processeur", "cpu_link"],
      ["gpu", "Carte graphique", "gpu_link"],
      ["ram", "Mémoire vive", "ram_link"],
      ["storage", "Stockage", "storage_link"],
      ["motherboard", "Carte mère", "motherboard_link"],
      ["psu", "Alimentation", "psu_link"],
      ["case", "Boîtier", "case_link"],
      ["cooling", "Refroidissement", "cooling_link"],
      ["os", "Système d'exploitation", "os_link"],
    ];

    // Fonction utilitaire pour détecter le marchand et adapter l'affichage du bouton
    function getMerchantInfo(url) {
      if (!url) return { name: 'Voir l\'offre', color: 'bg-zinc-800 text-zinc-300 border-zinc-700 hover:bg-zinc-700' };
      const lower = url.toLowerCase();
      
      if (lower.includes('pccomponentes')) {
        return { name: 'PcComponentes', color: 'bg-emerald-500/10 border-emerald-500/40 text-emerald-400 hover:bg-emerald-500/20' };
      }
      if (lower.includes('cdiscount')) {
        return { name: 'Cdiscount', color: 'bg-blue-500/10 border-blue-500/40 text-blue-400 hover:bg-blue-500/20' };
      }
      if (lower.includes('fnac')) {
        return { name: 'Fnac', color: 'bg-amber-500/10 border-amber-500/40 text-amber-400 hover:bg-amber-500/20' };
      }
      if (lower.includes('cybertek') || lower.includes('grosbill')) {
        return { name: 'Cybertek / GrosBill', color: 'bg-indigo-500/10 border-indigo-500/40 text-indigo-400 hover:bg-indigo-500/20' };
      }
      if (lower.includes('aliexpress')) {
        return { name: 'AliExpress', color: 'bg-red-500/10 border-red-500/40 text-red-400 hover:bg-red-500/20' };
      }
      // Par défaut Amazon ou autres liens d'affiliation généraux
      return { name: 'Amazon', color: 'bg-[#FF9900]/10 border-[#FF9900]/40 text-[#FF9900] hover:bg-[#FF9900]/20' };
    }

    function Logo({ className = "h-10 w-auto" }) {
      return (
        <svg viewBox="0 0 870 801" className={className} role="img" aria-label="Logo">
          <path fill="#D7272D" fillRule="evenodd" d="M870,136 860,140 782,203 781,423 773,418 628,212 623,213 504,392 494,384 405,251 399,249 312,380 311,483 202,549 88,483 88,310 197,244 204,244 313,307 359,235 203,142 197,142 1,259 1,532 195,648 203,649 398,532 400,402 405,403 501,545 505,545 622,368 629,365 858,680 870,690Z" />
          <path fill="#8C8C8C" fillRule="evenodd" d="M756,615 751,613 751,599 728,567 715,561 712,546 681,505 674,504 674,575 669,581 456,709 449,709 318,629 249,666 244,676 445,799 455,801 756,621ZM531,48 459,5 448,3 253,120 253,126 320,167 334,166 448,99 490,116 530,56ZM679,0 607,2 586,11 569,29 560,55 560,85 451,243 451,250 486,301 493,300 610,125 649,117 673,96 682,67ZM616,35 640,41 648,57 645,77 628,89 606,88 594,68 597,49Z" />
          <path fill="#F1373E" fillRule="evenodd" d="M323,452 313,465 314,482 351,502 352,452ZM4,265 5,376 14,382 36,382 43,361 44,289 34,278ZM825,233 793,209 783,210 781,423 771,417 629,216 619,220 504,392 495,386 406,254 395,256 318,371 317,381 354,393 403,329 492,454 506,459 618,298 629,293 738,439 781,443 820,438 825,429ZM311,212 305,203 194,144 194,144 48,233 48,240 83,256 202,193 309,252Z" />
          <path fill="#AD1B27" fillRule="evenodd" d="M868,310 857,307 837,312 828,325 826,548 820,552 629,295 619,299 504,466 496,463 409,335 399,332 355,400 354,507 205,597 175,586 49,508 8,527 7,535 190,645 203,648 395,533 400,402 408,407 497,539 506,541 622,368 629,365 858,680 869,684ZM355,233 315,212 313,249 305,255 206,196 196,195 53,279 45,289 46,500 54,502 88,479 91,307 197,244 312,305 356,243Z" />
          <path fill="#F2F2F2" fillRule="evenodd" d="M713,551 688,514 675,509 674,575 669,581 456,709 449,709 319,630 288,643 284,653 443,751 455,754 706,604 713,595ZM529,50 464,8 448,4 260,116 256,126 281,143 292,144 447,51 456,51 512,80 528,59ZM671,1 608,2 575,21 562,45 560,85 453,240 453,252 464,268 474,267 597,90 594,57 599,46 616,35 642,38 672,9Z" />
        </svg>
      );
    }

    function PcArt({ color = "#D91E29" }) {
      return (
        <svg viewBox="0 0 240 180" className="h-full w-full" role="img" aria-label="Illustration PC">
          <rect width="240" height="180" fill="#1C1C1C" />
          <rect x="70" y="20" width="100" height="142" rx="8" fill="#050505" />
          <rect x="77" y="27" width="86" height="128" rx="4" fill="#161616" />
          <g transform="translate(120 60)">
            <circle r="21" fill="none" stroke={color} strokeWidth="3" />
            {[0, 60, 120, 180, 240, 300].map((a) => (
              <path key={a} d="M0 0 C 5 -6, 12 -10, 15 -4 C 10 -2, 5 -1, 0 0" fill={color} opacity=".85" transform={`rotate(${a})`} />
            ))}
            <circle r="3.5" fill="#050505" />
          </g>
          <rect x="83" y="102" width="74" height="18" rx="3" fill="#2A2A2A" />
          <circle cx="100" cy="111" r="6" fill="none" stroke={color} strokeWidth="2" />
          <circle cx="124" cy="111" r="6" fill="none" stroke={color} strokeWidth="2" />
          <rect x="160" y="27" width="3" height="128" fill={color} />
        </svg>
      );
    }

    function ListingCard({ listing, onOpen }) {
      return (
        <button
          type="button"
          onClick={() => onOpen(listing.id)}
          className="group flex h-full flex-col overflow-hidden rounded-2xl border border-[#262626] bg-[#141414]/90 text-left hover:border-[#D91E29] hover:shadow-[0_0_25px_rgba(217,30,41,0.25)] focus:outline-none transition-all duration-300 backdrop-blur-sm"
        >
          <div className="relative aspect-[4/3] bg-[#0E0E0E] p-3 overflow-hidden flex items-center justify-center">
            {listing.image ? (
              <img src={listing.image} alt={listing.title} className="h-full w-full object-contain group-hover:scale-105 transition-transform duration-500" />
            ) : (
              <PcArt color={listing.accent || "#D91E29"} />
            )}
            <div className="absolute left-3 top-3 flex gap-2">
              {listing.range && (
                <span className="rounded-full bg-[#0A0A0A]/90 backdrop-blur-md border border-[#333] px-3 py-1 text-xs font-semibold text-[#E5E5E5]">
                  {listing.range}
                </span>
              )}
              {listing.condition && (
                <span className="rounded-full bg-emerald-950/80 backdrop-blur-md border border-emerald-500/40 px-3 py-1 text-xs font-semibold text-emerald-400">
                  {listing.condition}
                </span>
              )}
            </div>
          </div>
          <div className="flex flex-1 flex-col p-5">
            <h3 style={display} className="text-base font-semibold leading-snug text-[#F5F5F5] group-hover:text-[#FF5A60] transition-colors">
              {listing.title}
            </h3>
            <p style={display} className="mt-2 text-2xl font-extrabold text-[#F5F5F5]">
              {listing.price ? `~${eur.format(Number(listing.price))}` : ""}
            </p>
            <dl className="mt-4 space-y-1.5 border-t border-[#262626] pt-3 text-sm">
              {listing.cpu && <div className="flex justify-between gap-3"><dt className="text-[#8A8A8A]">CPU</dt><dd className="font-medium text-[#F5F5F5]">{listing.cpu}</dd></div>}
              {listing.gpu && <div className="flex justify-between gap-3"><dt className="text-[#8A8A8A]">GPU</dt><dd className="font-medium text-[#F5F5F5]">{listing.gpu}</dd></div>}
              {listing.ram && <div className="flex justify-between gap-3"><dt className="text-[#8A8A8A]">RAM</dt><dd className="font-medium text-[#F5F5F5]">{listing.ram}</dd></div>}
            </dl>
            <span className="mt-auto pt-4 text-xs font-bold text-[#FF5A60] flex items-center gap-1 group-hover:underline">
              Voir tous les composants & liens partenaires →
            </span>
          </div>
        </button>
      );
    }

    function ListingDetail({ listing, onBack }) {
      const specs = SPEC_ROWS.filter(([k]) => listing[k]);

      return (
        <div>
          <button onClick={onBack} className="mb-6 inline-flex items-center gap-2 text-sm font-semibold text-[#FF5A60] hover:text-[#D91E29] transition-colors">
            ← Retour aux configurations
          </button>
          
          <div className="grid gap-10 lg:grid-cols-[1.5fr_1fr] xl:grid-cols-[1.8fr_1fr]">
            <div>
              <div className="relative aspect-[16/10] overflow-hidden rounded-2xl border border-[#262626] bg-[#0E0E0E] p-4 shadow-2xl flex items-center justify-center">
                {listing.image ? (
                  <img src={listing.image} alt={listing.title} className="h-full w-full object-contain max-h-[450px]" />
                ) : (
                  <div className="w-1/2 h-full">
                    <PcArt color={listing.accent || "#D91E29"} />
                  </div>
                )}
              </div>
              
              {listing.description && (
                <section className="mt-8 rounded-2xl border border-[#262626] bg-[#141414]/80 p-6 backdrop-blur-md">
                  <h2 style={display} className="text-xl font-bold text-[#F5F5F5] border-b border-[#262626] pb-3">À propos de cette configuration</h2>
                  <p className="mt-4 whitespace-pre-line text-[15px] leading-relaxed text-[#D4D4D4]">{listing.description}</p>
                </section>
              )}

              <section className="mt-8">
                <h2 style={display} className="text-xl font-bold text-[#F5F5F5] mb-4">Détail des composants & Liens d'achat</h2>
                <div className="divide-y divide-[#262626] overflow-hidden rounded-2xl border border-[#262626] bg-[#141414]/80 backdrop-blur-md">
                  {specs.map(([k, label, linkKey]) => {
                    const componentName = listing[k];
                    const targetUrl = listing[linkKey] || `https://www.amazon.fr/s?k=${encodeURIComponent(componentName)}`;
                    const merchant = getMerchantInfo(targetUrl);

                    return (
                      <div key={k} className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 px-6 py-4 text-sm hover:bg-[#1C1C1C]/50 transition-colors">
                        <div>
                          <dt className="text-[#8A8A8A] text-xs uppercase tracking-wider">{label}</dt>
                          <dd className="font-semibold text-[#F5F5F5] mt-0.5">{componentName}</dd>
                        </div>
                        <a 
                          href={targetUrl} 
                          target="_blank" 
                          rel="noopener noreferrer" 
                          className={`inline-flex items-center justify-center gap-2 rounded-xl border px-4 py-2.5 text-xs font-bold transition-all shadow-md shrink-0 ${merchant.color}`}
                        >
                          🛒 Voir sur {merchant.name} →
                        </a>
                      </div>
                    );
                  })}
                </div>
              </section>
            </div>

            <aside className="lg:sticky lg:top-24 lg:self-start">
              <div className="rounded-2xl border border-[#262626] bg-[#141414]/90 p-6 backdrop-blur-md shadow-2xl">
                <div className="flex gap-2">
                  {listing.range && <span className="rounded-full bg-[#262626] px-3 py-1 text-xs font-semibold text-[#E5E5E5]">{listing.range}</span>}
                  {listing.condition && <span className="rounded-full bg-emerald-950 px-3 py-1 text-xs font-semibold text-emerald-400 border border-emerald-500/30">{listing.condition}</span>}
                </div>
                <h1 style={display} className="mt-4 text-2xl font-bold leading-tight text-[#F5F5F5]">{listing.title}</h1>
                <p style={display} className="mt-4 text-4xl font-extrabold text-[#F5F5F5]">{listing.price ? `~${eur.format(Number(listing.price))}` : ""}</p>
                
                <div className="mt-6 border-t border-[#262626] pt-4 text-xs text-[#8A8A8A] space-y-2">
                  <p className="flex items-center gap-2">💡 Chaque composant possède son lien direct vers le marchand partenaire.</p>
                  <p className="flex items-center gap-2">⚠️ En tant que partenaire affilié, nous réalisons un bénéfice sur les achats remplissant les conditions requises.</p>
                </div>
              </div>
            </aside>
          </div>
        </div>
      );
    }

    function App() {
      const [listings, setListings] = useState([]);
      const [query, setQuery] = useState("");
      const [selectedId, setSelectedId] = useState(null);

      useEffect(() => {
        fetch(CSV_URL)
          .then(response => response.text())
          .then(csvText => {
            const lines = csvText.trim().split(/\r?\n/);
            if (lines.length < 2) return;
            
            const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
            
            const parsed = lines.slice(1).map(line => {
              const values = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v ? v.trim().replace(/^"\vert{}"$/g, '') : '');
              let obj = {};
              headers.forEach((h, i) => { obj[h] = values[i] || ""; });
              return obj;
            }).filter(item => item.id);

            setListings(parsed);
          })
          .catch(err => console.error("Erreur au chargement du CSV :", err));
      }, []);

      const results = useMemo(() => {
        const q = query.toLowerCase();
        return listings.filter(l => ((l.title || "") + " " + (l.range || "") + " " + (l.cpu || "") + " " + (l.gpu || "")).toLowerCase().includes(q));
      }, [listings, query]);

      const selected = listings.find(l => String(l.id) === String(selectedId));

      return (
        <div style={bodyStyle} className="min-h-screen bg-[#0A0A0A] flex flex-col justify-between">
          <div>
            <header className="border-b border-[#262626] bg-[#141414]/80 backdrop-blur-md sticky top-0 z-40">
              <div className="w-full px-6 sm:px-12 lg:px-16 flex items-center justify-between gap-4 py-3.5">
                <button onClick={() => setSelectedId(null)} className="flex items-center gap-3 group">
                  <Logo className="h-10 w-auto group-hover:scale-105 transition-transform" />
                  <span style={display} className="text-xl font-extrabold tracking-tight text-[#F5F5F5] group-hover:text-[#FF5A60] transition-colors">OMN PC</span>
                </button>
              </div>
            </header>

            <main className="bg-grid-pattern w-full px-6 sm:px-12 lg:px-16 pb-16 pt-8">
              {selected ? (
                <ListingDetail listing={selected} onBack={() => setSelectedId(null)} />
              ) : (
                <>
                  <section className="py-6 text-center sm:text-left">
                    <h1 style={display} className="text-3xl font-extrabold sm:text-5xl lg:text-6xl tracking-tight">
                      Configs PC Gamer & <span className="text-[#D91E29]">Composants Partenaires</span>
                    </h1>
                    <p className="mt-3 text-[#A3A3A3] text-lg">Retrouvez toutes les configurations présentées sur nos réseaux.</p>

                    <div className="mt-8 max-w-2xl">
                      <input
                        type="search"
                        value={query}
                        onChange={(e) => setQuery(e.target.value)}
                        placeholder="Rechercher par gamme, processeur, carte graphique..."
                        className={inputCls}
                      />
                    </div>
                  </section>

                  <div className="grid gap-6 sm:grid-cols-2 lg:grid-cols-2 2xl:grid-cols-4 mt-6">
                    {results.map((l) => (
                      <ListingCard key={l.id} listing={l} onOpen={setSelectedId} />
                    ))}
                  </div>
                </>
              )}
            </main>
          </div>

          <footer className="border-t border-[#262626] bg-[#0E0E0E] py-8 text-xs text-[#8A8A8A]">
            <div className="w-full px-6 sm:px-12 lg:px-16 flex flex-col md:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <Logo className="h-6 w-auto" />
                <span style={display} className="font-bold text-[#F5F5F5]">OMN PC - Marketplace Affiliation Matériel PC</span>
              </div>
              <p>© 2026 OMN PC. Tous droits réservés.</p>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
