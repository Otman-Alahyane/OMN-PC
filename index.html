<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OMN PC – Configs PC Gamer & composants partenaires</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
  :root{--bg:#FFFFFF;--bg2:#F9FAFB;--bg3:#F3F4F6;--line:#E5E7EB;--ink:#111827;--ink2:#4B5563;--ink3:#6B7280;--red:#D91E29;--red-dark:#B91823;--shadow:0 1px 3px rgba(0,0,0,.05)}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss03"}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:2px solid var(--red);outline-offset:2px}
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(to right,rgba(17,24,39,.06) 1px,transparent 1px),linear-gradient(to bottom,rgba(17,24,39,.06) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:linear-gradient(to bottom,#000 55%,transparent 100%);mask-image:linear-gradient(to bottom,#000 55%,transparent 100%)}
  .page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
  .wrap{width:100%;max-width:1200px;margin:0 auto;padding:0 32px}
  main{flex:1}

  header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;height:64px}
  .brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;letter-spacing:-.01em}
  .brand svg{height:28px;width:auto}

  .hero{padding:80px 0 40px}
  h1{margin:0;font-size:clamp(32px,5vw,52px);line-height:1.05;font-weight:600;letter-spacing:-.035em;max-width:760px}
  .lead{margin:16px 0 0;max-width:520px;font-size:18px;line-height:1.55;color:var(--ink2)}
  .tools{display:flex;align-items:center;gap:20px;margin-top:36px;flex-wrap:wrap}
  .search{position:relative;flex:1;min-width:260px;max-width:520px}
  .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink3);pointer-events:none}
  .search input{width:100%;height:44px;padding:0 14px 0 42px;font:inherit;font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
  .search input::placeholder{color:#9CA3AF}
  .search input:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(217,30,41,.12)}
  .count{font-size:13px;color:var(--ink3)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px;padding:8px 0 96px}
  .card{display:flex;flex-direction:column;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;transition:border-color .2s,box-shadow .2s,transform .2s}
  .card:hover{border-color:#D1D5DB;box-shadow:0 12px 28px -8px rgba(17,24,39,.10);transform:translateY(-2px)}
  .thumb{position:relative;aspect-ratio:4/3;display:grid;place-items:center;padding:24px;background:var(--bg2);border-bottom:1px solid var(--line)}
  .thumb img,.thumb svg{width:100%;height:100%;object-fit:contain;transition:transform .4s}
  .card:hover .thumb img{transform:scale(1.03)}
  .tags{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--ink2)}
  .cbody{display:flex;flex:1;flex-direction:column;padding:20px}
  h3{margin:0;font-size:15px;line-height:1.4;font-weight:600;letter-spacing:-.01em}
  .price{margin-top:10px;font-size:28px;font-weight:600;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
  .specs{margin:18px 0 0;padding-top:14px;border-top:1px solid var(--line);display:grid;gap:9px;font-size:13px}
  .specs div{display:flex;justify-content:space-between;gap:16px}
  dt{color:var(--ink3)} dd{margin:0;font-weight:500;text-align:right}
  .more{margin-top:auto;padding-top:20px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--ink2);transition:color .15s}
  .more svg{transition:transform .2s}
  .card:hover .more{color:var(--red)} .card:hover .more svg{transform:translateX(3px)}

  .state{padding:64px 0 96px;text-align:center;color:var(--ink3);font-size:14px}

  .back{display:inline-flex;align-items:center;gap:6px;margin:32px 0 28px;font-size:14px;color:var(--ink2);transition:color .15s}
  .back:hover{color:var(--ink)}
  .layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:56px;align-items:start;padding-bottom:96px}
  .visual{position:sticky;top:88px}
  .panel{display:grid;place-items:center;aspect-ratio:1/1;max-height:660px;width:100%;padding:32px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .panel img{max-width:100%;max-height:100%;object-fit:contain}
  .panel svg{height:100%;width:60%}
  .info h1{margin:16px 0 0;max-width:none;font-size:clamp(26px,3vw,34px);line-height:1.15;letter-spacing:-.03em}
  .info .price{margin:12px 0 0;font-size:36px}
  .section{margin-top:40px}
  h2{margin:0 0 16px;font-size:18px;font-weight:600;letter-spacing:-.02em}
  .about{margin:0;font-size:15px;line-height:1.7;color:var(--ink2);white-space:pre-line}
  .list{margin:0;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
  .row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 20px;border-top:1px solid var(--line);transition:background .15s}
  .row:first-child{border-top:0} .row:hover{background:var(--bg2)}
  .row>div{min-width:0}
  .row dt{font-size:12px;color:var(--ink3)}
  .row dd{margin:2px 0 0;font-size:15px;font-weight:500;text-align:left}
  .buy{display:inline-flex;align-items:center;gap:8px;flex:none;height:36px;padding:0 14px;font-size:13px;font-weight:500;white-space:nowrap;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);transition:border-color .15s,color .15s}
  .buy:hover{border-color:var(--red);color:var(--red)}
  .dot{width:8px;height:8px;border-radius:50%}
  .note{display:grid;gap:12px;margin-top:40px;padding-top:20px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.55;color:var(--ink3)}
  .note p{display:flex;gap:10px;margin:0} .note svg{flex:none;margin-top:2px}

  footer{border-top:1px solid var(--line);background:var(--bg2);padding:28px 0;font-size:13px;color:var(--ink3)}
  .foot{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .foot b{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--ink)} .foot svg{height:22px;width:auto}

  @media(max-width:900px){.layout{grid-template-columns:1fr;gap:28px}.visual{position:static}.panel{aspect-ratio:4/3;max-height:none}.hero{padding:56px 0 32px}}
  @media(max-width:560px){.wrap{padding:0 20px}.row{flex-direction:column;align-items:flex-start}.panel{padding:20px}.info .price{font-size:32px}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { useState, useEffect, useMemo } = React;

  const eur = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });
  const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT4tfJ11NmT-PxEroLCjPhQ1YrEU_62ziDFq_HtlQXrqJ1WOjc-ga7iwdddUz3b2BdYM4TouScXIm3n/pub?output=csv';

  const SPEC_ROWS = [
    ["cpu", "Processeur", "cpu_link"],
    ["gpu", "Carte graphique", "gpu_link"],
    ["ram", "Mémoire vive", "ram_link"],
    ["storage", "Stockage", "storage_link"],
    ["motherboard", "Carte mère", "motherboard_link"],
    ["psu", "Alimentation", "psu_link"],
    ["case", "Boîtier", "case_link"],
    ["cooling", "Refroidissement", "cooling_link"],
    ["os", "Système d'exploitation", "os_link"],
  ];

  // Détecte le marchand pour adapter le libellé du bouton (point de couleur = marchand)
  function getMerchantInfo(url) {
    if (!url) return { name: "l'offre", dot: "#9CA3AF" };
    const lower = url.toLowerCase();
    if (lower.includes("pccomponentes")) return { name: "PcComponentes", dot: "#FF6000" };
    if (lower.includes("cdiscount")) return { name: "Cdiscount", dot: "#0055A4" };
    if (lower.includes("fnac")) return { name: "Fnac", dot: "#E1A925" };
    if (lower.includes("cybertek") || lower.includes("grosbill")) return { name: "Cybertek / GrosBill", dot: "#4F46E5" };
    if (lower.includes("aliexpress")) return { name: "AliExpress", dot: "#E62E04" };
    return { name: "Amazon", dot: "#FF9900" }; // Amazon ou autres liens d'affiliation
  }

  // Lecture CSV (gère les champs entre guillemets et les virgules internes)
  function parseCsv(text) {
    const rows = []; let row = [], cur = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
      else if (ch === '"') q = true;
      else if (ch === ",") { row.push(cur); cur = ""; }
      else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
      else cur += ch;
    }
    if (cur || row.length) { row.push(cur); rows.push(row); }
    return rows.filter((r) => r.some((c) => c.trim()));
  }

  const Icon = ({ d, size = 16 }) => (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d={d} /></svg>
  );
  const ARROW = "M5 12h14M13 6l6 6-6 6", BACK = "M19 12H5M11 18l-6-6 6-6", EXT = "M7 17 17 7M8 7h9v9", SEARCH = "M21 21l-4.3-4.3M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14z", INFO = "M12 16v-4M12 8h.01M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z", LINK = "M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1";

  function Logo({ className }) {
    return (
      <svg viewBox="0 0 870 801" className={className} role="img" aria-label="Logo OMN PC">
        <path fill="#D7272D" fillRule="evenodd" d="M870,136 860,140 782,203 781,423 773,418 628,212 623,213 504,392 494,384 405,251 399,249 312,380 311,483 202,549 88,483 88,310 197,244 204,244 313,307 359,235 203,142 197,142 1,259 1,532 195,648 203,649 398,532 400,402 405,403 501,545 505,545 622,368 629,365 858,680 870,690Z" />
          <path fill="#8C8C8C" fillRule="evenodd" d="M756,615 751,613 751,599 728,567 715,561 712,546 681,505 674,504 674,575 669,581 456,709 449,709 318,629 249,666 244,676 445,799 455,801 756,621ZM531,48 459,5 448,3 253,120 253,126 320,167 334,166 448,99 490,116 530,56ZM679,0 607,2 586,11 569,29 560,55 560,85 451,243 451,250 486,301 493,300 610,125 649,117 673,96 682,67ZM616,35 640,41 648,57 645,77 628,89 606,88 594,68 597,49Z" />
          <path fill="#F1373E" fillRule="evenodd" d="M323,452 313,465 314,482 351,502 352,452ZM4,265 5,376 14,382 36,382 43,361 44,289 34,278ZM825,233 793,209 783,210 781,423 771,417 629,216 619,220 504,392 495,386 406,254 395,256 318,371 317,381 354,393 403,329 492,454 506,459 618,298 629,293 738,439 781,443 820,438 825,429ZM311,212 305,203 194,144 194,144 48,233 48,240 83,256 202,193 309,252Z" />
          <path fill="#AD1B27" fillRule="evenodd" d="M868,310 857,307 837,312 828,325 826,548 820,552 629,295 619,299 504,466 496,463 409,335 399,332 355,400 354,507 205,597 175,586 49,508 8,527 7,535 190,645 203,648 395,533 400,402 408,407 497,539 506,541 622,368 629,365 858,680 869,684ZM355,233 315,212 313,249 305,255 206,196 196,195 53,279 45,289 46,500 54,502 88,479 91,307 197,244 312,305 356,243Z" />
          <path fill="#F2F2F2" fillRule="evenodd" d="M713,551 688,514 675,509 674,575 669,581 456,709 449,709 319,630 288,643 284,653 443,751 455,754 706,604 713,595ZM529,50 464,8 448,4 260,116 256,126 281,143 292,144 447,51 456,51 512,80 528,59ZM671,1 608,2 575,21 562,45 560,85 453,240 453,252 464,268 474,267 597,90 594,57 599,46 616,35 642,38 672,9Z" />
      </svg>
    );
  }

  function PcArt({ color = "#D91E29" }) {
    return (
      <svg viewBox="0 0 240 180" role="img" aria-label="Illustration PC">
        <rect x="74" y="20" width="92" height="142" rx="9" fill="#fff" stroke="#D1D5DB" strokeWidth="2" />
        <rect x="82" y="28" width="76" height="126" rx="5" fill="#F3F4F6" />
        <g transform="translate(120 62)">
          <circle r="21" fill="none" stroke={color} strokeWidth="2.5" />
          {[0, 60, 120, 180, 240, 300].map((a) => (
            <path key={a} d="M0 0 C 5 -6, 12 -10, 15 -4 C 10 -2, 5 -1, 0 0" fill={color} opacity=".85" transform={`rotate(${a})`} />
          ))}
          <circle r="3.5" fill="#fff" />
        </g>
        <rect x="88" y="104" width="64" height="18" rx="3" fill="#E5E7EB" />
        <circle cx="104" cy="113" r="6" fill="none" stroke={color} strokeWidth="2" />
        <circle cx="128" cy="113" r="6" fill="none" stroke={color} strokeWidth="2" />
      </svg>
    );
  }

  const price = (l) => (l.price ? `~${eur.format(Number(l.price))}` : "");

  function ListingCard({ listing, onOpen }) {
    return (
      <button type="button" className="card" onClick={() => onOpen(listing.id)}>
        <div className="thumb">
          {listing.image ? <img src={listing.image} alt={listing.title} /> : <PcArt color={listing.accent || "#D91E29"} />}
          <div className="tags">
            {listing.range && <span className="tag">{listing.range}</span>}
            {listing.condition && <span className="tag">{listing.condition}</span>}
          </div>
        </div>
        <div className="cbody">
          <h3>{listing.title}</h3>
          <p className="price" style={{ margin: "10px 0 0" }}>{price(listing)}</p>
          <dl className="specs" style={{ margin: "18px 0 0" }}>
            {listing.cpu && <div><dt>CPU</dt><dd>{listing.cpu}</dd></div>}
            {listing.gpu && <div><dt>GPU</dt><dd>{listing.gpu}</dd></div>}
            {listing.ram && <div><dt>RAM</dt><dd>{listing.ram}</dd></div>}
          </dl>
          <span className="more">Voir les composants et liens partenaires <Icon d={ARROW} size={14} /></span>
        </div>
      </button>
    );
  }

  function ListingDetail({ listing, onBack }) {
    const specs = SPEC_ROWS.filter(([k]) => listing[k]);
    return (
      <div className="wrap">
        <button className="back" onClick={onBack}><Icon d={BACK} size={16} /> Retour aux configurations</button>
        <div className="layout">
          <div className="visual">
            <div className="panel">
              {listing.image ? <img src={listing.image} alt={listing.title} /> : <PcArt color={listing.accent || "#D91E29"} />}
            </div>
          </div>

          <div className="info">
            <div className="tags" style={{ position: "static" }}>
              {listing.range && <span className="tag">{listing.range}</span>}
              {listing.condition && <span className="tag">{listing.condition}</span>}
            </div>
            <h1>{listing.title}</h1>
            <p className="price">{price(listing)}</p>

            <section className="section" id="composants">
              <h2>Détail des composants et liens d'achat</h2>
              <dl className="list">
                {specs.map(([k, label, linkKey]) => {
                  const componentName = listing[k];
                  const targetUrl = listing[linkKey] || `https://www.amazon.fr/s?k=${encodeURIComponent(componentName)}`;
                  const merchant = getMerchantInfo(targetUrl);
                  return (
                    <div key={k} className="row">
                      <div><dt>{label}</dt><dd>{componentName}</dd></div>
                      <a className="buy" href={targetUrl} target="_blank" rel="noopener noreferrer">
                        <span className="dot" style={{ background: merchant.dot }} />
                        Voir sur {merchant.name}
                        <Icon d={EXT} size={14} />
                      </a>
                    </div>
                  );
                })}
              </dl>
            </section>

            {listing.description && (
              <section className="section">
                <h2>À propos de cette configuration</h2>
                <p className="about">{listing.description}</p>
              </section>
            )}

            <div className="note">
              <p><Icon d={LINK} size={15} /> Chaque composant possède son lien direct vers le marchand partenaire.</p>
              <p><Icon d={INFO} size={15} /> En tant que partenaire affilié, nous réalisons un bénéfice sur les achats remplissant les conditions requises.</p>
            </div>
          </div>
        </div>
      </div>
    );
  }

  function App() {
    const [listings, setListings] = useState([]);
    const [status, setStatus] = useState("loading");
    const [query, setQuery] = useState("");
    const [selectedId, setSelectedId] = useState(null);

    useEffect(() => {
      fetch(CSV_URL)
        .then((response) => response.text())
        .then((csvText) => {
          const rows = parseCsv(csvText);
          if (rows.length < 2) { setStatus("ready"); return; }
          const headers = rows[0].map((h) => h.trim());
          const parsed = rows.slice(1).map((values) => {
            const obj = {};
            headers.forEach((h, i) => { obj[h] = (values[i] || "").trim(); });
            return obj;
          }).filter((item) => item.id);
          setListings(parsed);
          setStatus("ready");
        })
        .catch((err) => { console.error("Erreur au chargement du CSV :", err); setStatus("error"); });
    }, []);

    useEffect(() => { window.scrollTo(0, 0); }, [selectedId]);

    const results = useMemo(() => {
      const q = query.toLowerCase();
      return listings.filter((l) => ((l.title || "") + " " + (l.range || "") + " " + (l.cpu || "") + " " + (l.gpu || "")).toLowerCase().includes(q));
    }, [listings, query]);

    const selected = listings.find((l) => String(l.id) === String(selectedId));

    return (
      <div className="page">
        <header>
          <div className="wrap bar">
            <button className="brand" onClick={() => setSelectedId(null)}>
              <Logo /> OMN PC
            </button>
          </div>
        </header>

        <main>
          {selected ? (
            <ListingDetail listing={selected} onBack={() => setSelectedId(null)} />
          ) : (
            <div className="wrap">
              <section className="hero">
                <h1>Configs PC Gamer et composants partenaires</h1>
                <p className="lead">Retrouvez toutes les configurations présentées sur nos réseaux, avec les liens directs vers chaque composant.</p>
                <div className="tools">
                  <label className="search">
                    <Icon d={SEARCH} size={16} />
                    <input type="search" value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Rechercher par gamme, processeur, carte graphique…" />
                  </label>
                  {status === "ready" && <span className="count">{results.length} configuration{results.length > 1 ? "s" : ""}</span>}
                </div>
              </section>

              {status === "loading" && <p className="state">Chargement des configurations…</p>}
              {status === "error" && <p className="state">Impossible de charger les configurations. Réessaie dans un instant.</p>}
              {status === "ready" && results.length === 0 && <p className="state">Aucune configuration ne correspond à ta recherche.</p>}
              <div className="grid">
                {results.map((l) => <ListingCard key={l.id} listing={l} onOpen={setSelectedId} />)}
              </div>
            </div>
          )}
        </main>

        <footer>
          <div className="wrap foot">
            <b><Logo /> OMN PC – Marketplace affiliation matériel PC</b>
            <span>© 2026 OMN PC. Tous droits réservés.</span>
          </div>
        </footer>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
