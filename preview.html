<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><title>OMN PC - Vidéo TikTok</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;background:#050505;color:#F5F5F5;font-family:system-ui,sans-serif}
  #bar{position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;gap:14px;align-items:center;padding:0 18px;background:#111;border-top:1px solid #2a2a2a}
  #bar button{background:#D91E29;color:#fff;border:0;border-radius:8px;padding:8px 18px;font-weight:700;cursor:pointer}
  #bar input{flex:1;accent-color:#D91E29}
  #stage{transform-origin:top left;position:absolute;top:0}
  .render #bar{display:none}
</style></head>
<body>
<div id="stage"><div id="video"></div></div>
<div id="bar"><button id="play">Pause</button><input id="seek" type="range" min="0" max="359" value="0"><span id="time">0.0 s</span></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script type="text/babel">

/**
 * OmnPcVideo : composant 100 % déterministe. Même `frame` => même image.
 * Utilisable tel quel dans Remotion (frame = useCurrentFrame()) ou Puppeteer (preview.html).
 * Format 1080x1920, 30 fps, 12 s (360 images).
 */
const W = 1080, H = 1920, FPS = 30, DURATION = 12 * FPS;

// Ligne 1 de configs.csv (Google Sheets). Remplace-la par n'importe quelle ligne.
const DEFAULT_CONFIG = {
  title: "PC Gamer Entrée de gamme",
  price: 850,
  condition: "100% Neuf",
  cpu: "AMD Ryzen 5 5500",
  gpu: "AMD Radeon RX 7600",
  ram: "16 Go DDR4 3200MHz White",
  storage: "SSD SATA 500 Go",
  image: "pc_entree_de_gamme.png",
  cta: "omnpc.netlify.app",
  accent: "#D91E29",
};

/* ---------- utilitaires d'animation ---------- */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, p) => a + (b - a) * p;
const seg = (t, from, dur) => clamp((t - from) / dur);
const outQuart = (p) => 1 - Math.pow(1 - clamp(p), 4);
const outBack = (p) => { p = clamp(p); const c = 1.70158; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const inOut = (p) => { p = clamp(p); return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; };
const mixBox = (a, b, p) => Object.fromEntries(Object.keys(a).map((k) => [k, lerp(a[k], b[k], p)]));

const DISPLAY = '"Bricolage Grotesque", system-ui, sans-serif';
const BODY = '"DM Sans", system-ui, sans-serif';
const FONT_CSS = `@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@500;700&display=swap');`;

const Logo = ({ style }) => (
  <svg viewBox="0 0 870 801" style={style}><path fill="#D7272D" fillRule="evenodd" d="M870,136 860,140 782,203 781,423 773,418 628,212 623,213 504,392 494,384 405,251 399,249 312,380 311,483 202,549 88,483 88,310 197,244 204,244 313,307 359,235 203,142 197,142 1,259 1,532 195,648 203,649 398,532 400,402 405,403 501,545 505,545 622,368 629,365 858,680 870,690Z" />
          <path fill="#8C8C8C" fillRule="evenodd" d="M756,615 751,613 751,599 728,567 715,561 712,546 681,505 674,504 674,575 669,581 456,709 449,709 318,629 249,666 244,676 445,799 455,801 756,621ZM531,48 459,5 448,3 253,120 253,126 320,167 334,166 448,99 490,116 530,56ZM679,0 607,2 586,11 569,29 560,55 560,85 451,243 451,250 486,301 493,300 610,125 649,117 673,96 682,67ZM616,35 640,41 648,57 645,77 628,89 606,88 594,68 597,49Z" />
          <path fill="#F1373E" fillRule="evenodd" d="M323,452 313,465 314,482 351,502 352,452ZM4,265 5,376 14,382 36,382 43,361 44,289 34,278ZM825,233 793,209 783,210 781,423 771,417 629,216 619,220 504,392 495,386 406,254 395,256 318,371 317,381 354,393 403,329 492,454 506,459 618,298 629,293 738,439 781,443 820,438 825,429ZM311,212 305,203 194,144 194,144 48,233 48,240 83,256 202,193 309,252Z" />
          <path fill="#AD1B27" fillRule="evenodd" d="M868,310 857,307 837,312 828,325 826,548 820,552 629,295 619,299 504,466 496,463 409,335 399,332 355,400 354,507 205,597 175,586 49,508 8,527 7,535 190,645 203,648 395,533 400,402 408,407 497,539 506,541 622,368 629,365 858,680 869,684ZM355,233 315,212 313,249 305,255 206,196 196,195 53,279 45,289 46,500 54,502 88,479 91,307 197,244 312,305 356,243Z" />
          <path fill="#F2F2F2" fillRule="evenodd" d="M713,551 688,514 675,509 674,575 669,581 456,709 449,709 319,630 288,643 284,653 443,751 455,754 706,604 713,595ZM529,50 464,8 448,4 260,116 256,126 281,143 292,144 447,51 456,51 512,80 528,59ZM671,1 608,2 575,21 562,45 560,85 453,240 453,252 464,268 474,267 597,90 594,57 599,46 616,35 642,38 672,9Z" /></svg>
);

const ICONS = {
  cpu: <><rect x="6" y="6" width="12" height="12" rx="2" /><rect x="9.5" y="9.5" width="5" height="5" /><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4" /></>,
  gpu: <><rect x="2" y="6" width="20" height="10" rx="2" /><circle cx="9" cy="11" r="3" /><circle cx="16" cy="11" r="1.6" /><path d="M5 19h14" /></>,
  ram: <><rect x="2" y="7" width="20" height="9" rx="1.5" /><path d="M6 10.5v2M10 10.5v2M14 10.5v2M18 10.5v2M5 16v3M9 16v3M13 16v3M17 16v3" /></>,
  storage: <><rect x="3" y="5" width="18" height="14" rx="2.5" /><circle cx="7.5" cy="9.5" r="1" /><path d="M12 15h6" /></>,
};
const CARDS = [
  { key: "cpu", label: "Processeur" },
  { key: "gpu", label: "Carte graphique" },
  { key: "ram", label: "Mémoire vive" },
  { key: "storage", label: "Stockage" },
];

// Mots qui montent depuis un masque, l'un après l'autre
function Words({ text, t, from, step = 0.12, dur = 0.55 }) {
  return text.split(" ").map((w, i) => {
    const p = outQuart(seg(t, from + i * step, dur));
    return (
      <span key={i} style={{ display: "inline-block", overflow: "hidden", verticalAlign: "top", padding: "0 .14em .1em" }}>
        <span style={{ display: "inline-block", transform: `translateY(${(1 - p) * 115}%)` }}>{w}</span>
      </span>
    );
  });
}

const abs = (b) => ({ position: "absolute", left: b.left, top: b.top, width: b.w, padding: `0 ${b.pad || 0}px`, boxSizing: "border-box", textAlign: "center" });

function OmnPcVideo({ frame = 0, config = {} }) {
  const c = { ...DEFAULT_CONFIG, ...config };
  const t = frame / FPS;

  /* Éléments partagés : prix, titre, badge et PC glissent de la scène 1 vers la scène 2 */
  const p12 = inOut(seg(t, 2.9, 0.9));
  const priceB = mixBox({ top: 170, size: 330, left: 0, w: 1080, pad: 0 }, { top: 230, size: 170, left: 50, w: 380, pad: 0 }, p12);
  const titleB = mixBox({ top: 500, size: 78, left: 0, w: 1080, pad: 70 }, { top: 430, size: 44, left: 50, w: 380, pad: 0 }, p12);
  const badgeB = mixBox({ top: 100, size: 34, left: 0, w: 1080, pad: 0 }, { top: 580, size: 30, left: 50, w: 380, pad: 0 }, p12);
  const exit = inOut(seg(t, 7.7, 0.45)); // sortie de la scène 2

  const pcA = { left: 150, top: 730, w: 780 };
  const pcB = { left: 470, top: 40, w: 570 };
  const pcC = { left: 260, top: 290, w: 560 };
  const pc = mixBox(mixBox(pcA, pcB, p12), pcC, inOut(seg(t, 7.8, 0.9)));
  const en = outQuart(seg(t, 0.35, 0.95));
  const pcH = (pc.w * 1500) / 1140;

  // Prix : compteur + éclat RGB qui se résorbe
  const pp = seg(t, 0.15, 1.1);
  const shown = Math.round(c.price * outQuart(pp));
  const g = 1 - outQuart(seg(t, 0.15, 0.9));
  const punch = lerp(1.35, 1, outBack(seg(t, 0.15, 0.75)));

  return (
    <div style={{ position: "relative", width: W, height: H, overflow: "hidden", background: "#0A0A0A", color: "#F5F5F5", fontFamily: BODY, "--red": c.accent }}>
      <style>{FONT_CSS}</style>

      {/* Fond : grille, halo rouge qui respire, LEDs qui montent */}
      <div style={{ position: "absolute", inset: 0, backgroundSize: "36px 36px", backgroundImage: "linear-gradient(to right, rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,.025) 1px, transparent 1px)" }} />
      <div style={{ position: "absolute", left: -160, top: -260, width: 1400, height: 1100, borderRadius: "50%", background: "radial-gradient(circle, color-mix(in srgb, var(--red) 24%, transparent) 0%, transparent 70%)", transform: `scale(${0.92 + 0.12 * Math.sin(t * 1.3)})`, opacity: 0.85 }} />
      {Array.from({ length: 9 }, (_, i) => {
        const s = 6 + (i % 3) * 4;
        const y = H + 40 - ((t * (36 + i * 8) + i * 260) % (H + 120));
        return <div key={i} style={{ position: "absolute", left: 40 + ((i * 137) % 1000), top: y, width: s, height: s, borderRadius: "50%", background: "var(--red)", opacity: 0.35, boxShadow: "0 0 18px var(--red), 0 0 40px var(--red)" }} />;
      })}

      {/* PC : une seule image pour tout le film */}
      <div style={{ position: "absolute", left: pc.left, top: pc.top + (1 - en) * 260 + Math.sin(t * 2) * 9, width: pc.w, height: pcH, opacity: en, transform: `scale(${lerp(0.85, 1, en)})` }}>
        <div style={{ position: "absolute", inset: "-8% -28%", background: "radial-gradient(closest-side, color-mix(in srgb, var(--red) 46%, transparent), transparent)", opacity: 0.8 + 0.2 * Math.sin(t * 2.4) }} />
        <img src={c.image} alt="" style={{ position: "relative", width: "100%", display: "block", filter: "drop-shadow(0 40px 60px rgba(0,0,0,.6))" }} />
      </div>

      {/* Badge + prix + titre (scènes 1 et 2) */}
      <div style={{ ...abs(badgeB), opacity: seg(t, 0.1, 0.3) * (1 - exit), transform: `translateY(${-exit * 80}px)` }}>
        <span style={{ display: "inline-block", fontSize: badgeB.size, fontWeight: 700, padding: "10px 30px", borderRadius: 999, border: "2px solid var(--red)", background: "color-mix(in srgb, var(--red) 14%, transparent)" }}>{c.condition}</span>
      </div>
      <div style={{ ...abs(priceB), opacity: seg(t, 0.1, 0.2) * (1 - exit), transform: `translateY(${-exit * 80}px) scale(${punch})`, fontFamily: DISPLAY, fontWeight: 800, fontSize: priceB.size, lineHeight: 1, letterSpacing: "-0.04em", textShadow: `${g * 18}px 0 rgba(255,40,60,.9), ${-g * 18}px 0 rgba(0,220,255,.55), 0 0 90px color-mix(in srgb, var(--red) 55%, transparent)` }}>
        {shown}€
      </div>
      <div style={{ ...abs(titleB), opacity: 1 - exit, transform: `translateY(${-exit * 80}px)`, fontFamily: DISPLAY, fontWeight: 800, fontSize: titleB.size, lineHeight: 1.12, letterSpacing: "-0.02em" }}>
        <Words text={c.title} t={t} from={0.9} />
      </div>

      {/* Scène 2 : les composants arrivent en alternance gauche / droite */}
      {CARDS.map((k, i) => {
        const start = 3.7 + i * 0.5;
        const p = seg(t, start, 0.8);
        const dir = i % 2 ? 1 : -1;
        const f = 1 - seg(t, start + 0.3, 0.8); // flash rouge à l'atterrissage
        return (
          <div key={k.key} style={{ position: "absolute", left: 60, top: 820 + i * 192, width: 960, height: 170, boxSizing: "border-box", display: "flex", alignItems: "center", gap: 32, padding: "0 36px", borderRadius: 28, background: "linear-gradient(135deg,#171717,#0F0F0F)", border: `2px solid color-mix(in srgb, var(--red) ${f * 100}%, #2A2A2A)`, boxShadow: `0 0 ${70 * f}px color-mix(in srgb, var(--red) 50%, transparent)`, opacity: clamp(p * 4) * (1 - exit), transform: `translateX(${(1 - outBack(p)) * dir * 760 + exit * dir * 300}px)` }}>
            <div style={{ width: 96, height: 96, borderRadius: 22, flex: "none", display: "grid", placeItems: "center", background: "color-mix(in srgb, var(--red) 16%, transparent)", color: "var(--red)" }}>
              <svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">{ICONS[k.key]}</svg>
            </div>
            <div>
              <div style={{ fontSize: 28, fontWeight: 500, color: "#8C8C8C" }}>{k.label}</div>
              <div style={{ fontFamily: DISPLAY, fontSize: 48, fontWeight: 700, lineHeight: 1.08, letterSpacing: "-0.01em" }}>{c[k.key]}</div>
            </div>
          </div>
        );
      })}

      {/* Scène 3 : appel à l'action */}
      {(() => {
        const lp = outBack(seg(t, 8.1, 0.7));
        const pp3 = outBack(seg(t, 9.2, 0.7));
        const pulse = t > 9.9 ? 1 + 0.025 * Math.sin((t - 9.9) * 6) : 1;
        return (
          <>
            <div style={{ position: "absolute", left: 0, top: 100, width: W, display: "flex", justifyContent: "center", alignItems: "center", gap: 28, opacity: clamp(lp * 3), transform: `scale(${lerp(0.4, 1, lp)})` }}>
              <Logo style={{ height: 150, width: "auto" }} />
              <span style={{ fontFamily: DISPLAY, fontWeight: 800, fontSize: 72, letterSpacing: "-0.03em" }}>OMN PC</span>
            </div>
            <div style={{ ...abs({ left: 0, top: 1090, w: 1080, pad: 80 }), fontFamily: DISPLAY, fontWeight: 700, fontSize: 62, lineHeight: 1.15 }}>
              <Words text="Retrouve tous les liens sur" t={t} from={8.7} step={0.09} />
            </div>
            <div style={{ position: "absolute", left: 0, top: 1210, width: W, display: "flex", justifyContent: "center", opacity: clamp(pp3 * 3), transform: `scale(${lerp(0.6, 1, pp3) * pulse})` }}>
              <div style={{ fontFamily: DISPLAY, fontWeight: 800, fontSize: 90, letterSpacing: "-0.03em", padding: "26px 54px", borderRadius: 999, background: "var(--red)", boxShadow: `0 0 ${70 + 30 * Math.sin(t * 5)}px color-mix(in srgb, var(--red) 70%, transparent)` }}>{c.cta}</div>
            </div>
            <div style={{ ...abs({ left: 0, top: 1405, w: 1080, pad: 80 }), fontSize: 38, fontWeight: 500, color: "#8C8C8C", opacity: seg(t, 9.9, 0.5) }}>
              {c.title}, {c.price}€
            </div>
          </>
        );
      })()}
    </div>
  );
}

const RENDER = location.search.includes("render");
if (RENDER) document.body.classList.add("render");
const CONFIG = window.OMN_CONFIG || {};
const root = ReactDOM.createRoot(document.getElementById("video"));
const draw = (f) => ReactDOM.flushSync(() => root.render(<OmnPcVideo frame={f} config={CONFIG} />));

// API Puppeteer : await page.evaluate(n => window.renderFrame(n), n)
const FONTS = ['800 100px "Bricolage Grotesque"', '700 40px "Bricolage Grotesque"', '500 30px "DM Sans"', '700 30px "DM Sans"'];
window.ready = (async () => {
  draw(0);
  await Promise.all(FONTS.map((f) => document.fonts.load(f)));
  await new Promise((r) => { const i = new Image(); i.onload = i.onerror = r; i.src = CONFIG.image || DEFAULT_CONFIG.image; });
})();
window.renderFrame = async (f) => { await window.ready; draw(f); };

function fit() {
  const s = RENDER ? 1 : Math.min(innerWidth / W, (innerHeight - 56) / H);
  const st = document.getElementById("stage");
  st.style.transform = `scale(${s})`;
  st.style.left = RENDER ? 0 : Math.max(0, (innerWidth - W * s) / 2) + "px";
}
addEventListener("resize", fit); fit();

if (!RENDER) {
  const play = document.getElementById("play"), seek = document.getElementById("seek"), time = document.getElementById("time");
  let playing = true, start = performance.now(), cur = 0;
  const show = (f) => { cur = f; draw(f); seek.value = f; time.textContent = (f / FPS).toFixed(1) + " s"; };
  play.onclick = () => { playing = !playing; play.textContent = playing ? "Pause" : "Lire"; start = performance.now() - (cur / FPS) * 1000; };
  seek.oninput = () => { playing = false; play.textContent = "Lire"; show(+seek.value); };
  window.ready.then(() => {
    (function loop(now) {
      if (playing) show(Math.floor(((now - start) / 1000 * FPS) % DURATION));
      requestAnimationFrame(loop);
    })(performance.now());
  });
}
</script></body></html>
