<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><title>OMN PC - Slides TikTok</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#050505;color:#F5F5F5;font-family:"DM Sans",system-ui,sans-serif}
  #sheet{display:flex;flex-wrap:wrap;gap:20px;padding:24px;justify-content:center}
  .thumb{width:324px;height:576px;overflow:hidden;border-radius:12px;border:1px solid #2a2a2a}
  .thumb>div{transform:scale(.3);transform-origin:top left}
  .render #sheet{display:block;padding:0}
</style></head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script type="text/babel">
const DEFAULT_CONFIG = {
  title: "PC Gamer Entrée de gamme", price: 850, condition: "100% Neuf",
  cpu: "AMD Ryzen 5 5500", gpu: "AMD Radeon RX 7600", ram: "16 Go DDR4 3200MHz White", storage: "SSD SATA 500 Go",
  motherboard: "Gigabyte A520m k", psu: "Corsair 650W 80+ Bronze", case: "Boîtier Blanc ARGB",
  cooling: "Ventirad Blanc Thermalright", os: "Windows 11 Pro",
  description: "Idéal pour débuter dans le gaming sur PC sans se ruiner.",
  image: "pc_entree_de_gamme.png", cta: "omnpc.netlify.app", accent: "#D91E29",
};
const C = { ...DEFAULT_CONFIG, ...(window.OMN_CONFIG || {}) };
const TOTAL = 5;
const DISPLAY = '"Bricolage Grotesque", system-ui, sans-serif';
const BODY = '"DM Sans", system-ui, sans-serif';
const H = { fontFamily: DISPLAY, fontWeight: 800, letterSpacing: "-0.03em", lineHeight: 1.05 };
const LABELS = { cpu: "Processeur", gpu: "Carte graphique", ram: "Mémoire vive", storage: "Stockage", motherboard: "Carte mère", psu: "Alimentation", case: "Boîtier", cooling: "Refroidissement", os: "Système" };
const Logo = ({ style }) => (<svg viewBox="0 0 870 801" style={style}><path fill="#D7272D" fillRule="evenodd" d="M870,136 860,140 782,203 781,423 773,418 628,212 623,213 504,392 494,384 405,251 399,249 312,380 311,483 202,549 88,483 88,310 197,244 204,244 313,307 359,235 203,142 197,142 1,259 1,532 195,648 203,649 398,532 400,402 405,403 501,545 505,545 622,368 629,365 858,680 870,690Z" />
          <path fill="#8C8C8C" fillRule="evenodd" d="M756,615 751,613 751,599 728,567 715,561 712,546 681,505 674,504 674,575 669,581 456,709 449,709 318,629 249,666 244,676 445,799 455,801 756,621ZM531,48 459,5 448,3 253,120 253,126 320,167 334,166 448,99 490,116 530,56ZM679,0 607,2 586,11 569,29 560,55 560,85 451,243 451,250 486,301 493,300 610,125 649,117 673,96 682,67ZM616,35 640,41 648,57 645,77 628,89 606,88 594,68 597,49Z" />
          <path fill="#F1373E" fillRule="evenodd" d="M323,452 313,465 314,482 351,502 352,452ZM4,265 5,376 14,382 36,382 43,361 44,289 34,278ZM825,233 793,209 783,210 781,423 771,417 629,216 619,220 504,392 495,386 406,254 395,256 318,371 317,381 354,393 403,329 492,454 506,459 618,298 629,293 738,439 781,443 820,438 825,429ZM311,212 305,203 194,144 194,144 48,233 48,240 83,256 202,193 309,252Z" />
          <path fill="#AD1B27" fillRule="evenodd" d="M868,310 857,307 837,312 828,325 826,548 820,552 629,295 619,299 504,466 496,463 409,335 399,332 355,400 354,507 205,597 175,586 49,508 8,527 7,535 190,645 203,648 395,533 400,402 408,407 497,539 506,541 622,368 629,365 858,680 869,684ZM355,233 315,212 313,249 305,255 206,196 196,195 53,279 45,289 46,500 54,502 88,479 91,307 197,244 312,305 356,243Z" />
          <path fill="#F2F2F2" fillRule="evenodd" d="M713,551 688,514 675,509 674,575 669,581 456,709 449,709 319,630 288,643 284,653 443,751 455,754 706,604 713,595ZM529,50 464,8 448,4 260,116 256,126 281,143 292,144 447,51 456,51 512,80 528,59ZM671,1 608,2 575,21 562,45 560,85 453,240 453,252 464,268 474,267 597,90 594,57 599,46 616,35 642,38 672,9Z" /></svg>);

function Frame({ i, children }) {
  return (
    <div style={{ position: "relative", width: 1080, height: 1920, overflow: "hidden", background: "#0A0A0A", color: "#F5F5F5", fontFamily: BODY, "--red": C.accent }}>
      <div style={{ position: "absolute", inset: 0, backgroundSize: "40px 40px", backgroundImage: "radial-gradient(circle, rgba(255,255,255,.09) 1.5px, transparent 2px)" }} />
      <div style={{ position: "absolute", left: 300, top: 900, width: 1200, height: 1200, borderRadius: "50%", background: "radial-gradient(circle, color-mix(in srgb, var(--red) 14%, transparent), transparent 65%)" }} />
      {children}
      <div style={{ position: "absolute", left: 60, top: 120, width: 960, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 18 }}>
          <Logo style={{ height: 64, width: "auto" }} />
          <span style={{ ...H, fontSize: 36, fontWeight: 700 }}>OMN PC</span>
        </div>
        <span style={{ fontSize: 30, fontWeight: 500, color: "#8C8C8C" }}>{i + 1} / {TOTAL}</span>
      </div>
      <div style={{ position: "absolute", left: 60, top: 210, width: 960, height: 1, background: "#2A2A2A" }}>
        <div style={{ position: "absolute", top: -1, left: (960 / TOTAL) * i, width: 960 / TOTAL, height: 3, background: "var(--red)" }} />
      </div>
    </div>
  );
}

// Anneaux concentriques fins + un arc rouge
const Rings = ({ cx, cy, r, arc = 420, rot = -40 }) => (
  <svg width="1080" height="1920" style={{ position: "absolute", left: 0, top: 0 }}>
    {r.map((v) => <circle key={v} cx={cx} cy={cy} r={v} fill="none" stroke="rgba(255,255,255,.09)" strokeWidth="1.5" />)}
    <circle cx={cx} cy={cy} r={r[1]} fill="none" stroke="var(--red)" strokeWidth="4" strokeLinecap="round" strokeDasharray={`${arc} 9999`} transform={`rotate(${rot} ${cx} ${cy})`} />
  </svg>
);

const PC = ({ left, top, w }) => (
  <div style={{ position: "absolute", left, top, width: w }}>
    <img src={C.image} alt="" style={{ position: "relative", width: "100%", display: "block", filter: "drop-shadow(0 40px 60px rgba(0,0,0,.65))" }} />
  </div>
);

// Fenêtre HUD : zoom sur une zone de la photo, avec angles rouges
const Crop = ({ x, y, w, top, h }) => {
  const s = 960 / w;
  const corner = (st) => <div style={{ position: "absolute", width: 40, height: 40, borderColor: "var(--red)", borderStyle: "solid", borderWidth: 0, ...st }} />;
  return (
    <div style={{ position: "absolute", left: 60, top, width: 960, height: h, overflow: "hidden" }}>
      <div style={{ position: "absolute", inset: 0, background: "radial-gradient(closest-side at 45% 50%, color-mix(in srgb, var(--red) 26%, transparent), transparent)" }} />
      <img src={C.image} alt="" style={{ position: "absolute", left: -x * s, top: -y * s, width: 1140 * s, filter: "drop-shadow(0 30px 40px rgba(0,0,0,.5))" }} />
      {corner({ top: 0, left: 0, borderTopWidth: 3, borderLeftWidth: 3 })}
      {corner({ top: 0, right: 0, borderTopWidth: 3, borderRightWidth: 3 })}
      {corner({ bottom: 0, left: 0, borderBottomWidth: 3, borderLeftWidth: 3 })}
      {corner({ bottom: 0, right: 0, borderBottomWidth: 3, borderRightWidth: 3 })}
    </div>
  );
};

// Ligne de fiche technique : filet fin, repère rouge, valeur en grand
const Spec = ({ k, top, h, size }) => (
  <div style={{ position: "absolute", left: 60, top, width: 960, height: h, borderTop: "1px solid #2A2A2A", display: "flex", flexDirection: "column", justifyContent: "center" }}>
    <div style={{ position: "absolute", left: 0, top: -2, width: 44, height: 3, background: "var(--red)" }} />
    <div style={{ fontSize: 26, fontWeight: 500, color: "#8C8C8C", marginBottom: 6 }}>{LABELS[k]}</div>
    <div style={{ ...H, fontSize: size, fontWeight: 700, letterSpacing: "-0.02em", whiteSpace: "nowrap" }}>{C[k]}</div>
  </div>
);

const Pill = ({ children }) => (
  <span style={{ display: "inline-block", fontWeight: 700, fontSize: 30, padding: "8px 26px", borderRadius: 999, border: "2px solid var(--red)", whiteSpace: "nowrap" }}>{children}</span>
);

const SLIDES = [
  // 1. Accroche : prix géant, anneaux, PC qui déborde de l'écran
  (i) => (
    <Frame i={i}>
      <Rings cx={640} cy={1230} r={[330, 540, 760]} arc={560} />
      <PC left={150} top={690} w={820} />
      <div style={{ position: "absolute", left: 60, top: 262, width: 960, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <span style={{ ...H, fontSize: 50, fontWeight: 500, color: "#D8D8D8" }}>{C.title}</span>
      </div>
      <div style={{ ...H, position: "absolute", left: 44, top: 340, fontSize: 430, lineHeight: 0.9, letterSpacing: "-0.06em", whiteSpace: "nowrap" }}>
        {C.price}<span style={{ fontSize: 220, color: "var(--red)", position: "relative", top: -90, marginLeft: 12, letterSpacing: 0 }}>€</span>
      </div>
      <div style={{ position: "absolute", left: 60, top: 740 }}><Pill>{C.condition}</Pill></div>
    </Frame>
  ),
  // 2. Le coeur : zoom sur le ventirad + 4 lignes
  (i) => (
    <Frame i={i}>
      <div style={{ ...H, position: "absolute", left: 60, top: 252, fontSize: 72 }}>Le cœur de la config</div>
      <Crop x={40} y={380} w={640} top={360} h={540} />
      {["cpu", "gpu", "ram", "storage"].map((k, n) => <Spec key={k} k={k} top={950 + n * 150} h={150} size={62} />)}
    </Frame>
  ),
  // 3. Le reste : zoom sur la carte graphique + 5 lignes
  (i) => (
    <Frame i={i}>
      <div style={{ ...H, position: "absolute", left: 60, top: 252, fontSize: 72 }}>Et tout le reste</div>
      <Crop x={40} y={800} w={640} top={360} h={440} />
      {["motherboard", "psu", "case", "cooling", "os"].map((k, n) => <Spec key={k} k={k} top={850 + n * 130} h={130} size={50} />)}
    </Frame>
  ),
  // 4. Verdict : grande typo + PC en bas qui déborde
  (i) => (
    <Frame i={i}>
      <PC left={330} top={1020} w={820} />
      <div style={{ ...H, position: "absolute", left: 60, top: 290, width: 960, fontSize: 112, fontWeight: 700, lineHeight: 1.06, letterSpacing: "-0.04em" }}>{C.description}</div>
      <div style={{ position: "absolute", left: 60, top: 1300, width: 330, borderTop: "1px solid #2A2A2A", paddingTop: 20 }}>
        <div style={{ position: "absolute", left: 0, top: -2, width: 44, height: 3, background: "var(--red)" }} />
        <div style={{ fontSize: 26, fontWeight: 500, color: "#8C8C8C" }}>La config complète</div>
        <div style={{ ...H, fontSize: 130, letterSpacing: "-0.05em" }}>{C.price}€</div>
      </div>
    </Frame>
  ),
  // 5. Appel à l'action : logo au centre des anneaux
  (i) => (
    <Frame i={i}>
      <Rings cx={540} cy={760} r={[210, 400, 600]} arc={460} rot={-100} />
      <div style={{ position: "absolute", left: 0, top: 640, width: 1080, display: "flex", justifyContent: "center" }}>
        <Logo style={{ height: 240, width: "auto" }} />
      </div>
      <div style={{ ...H, position: "absolute", left: 0, top: 1140, width: 1080, textAlign: "center", fontSize: 62, fontWeight: 500, color: "#D8D8D8" }}>Retrouve tous les liens sur</div>
      <div style={{ position: "absolute", left: 0, top: 1250, width: 1080, display: "flex", justifyContent: "center" }}>
        <div style={{ ...H, fontSize: 86, padding: "24px 52px", borderRadius: 999, background: "var(--red)" }}>{C.cta}</div>
      </div>
      <div style={{ position: "absolute", left: 0, top: 1430, width: 1080, textAlign: "center", fontSize: 36, fontWeight: 500, color: "#8C8C8C" }}>{C.title}, {C.price}€</div>
    </Frame>
  ),
];

const RENDER = location.search.includes("render");
if (RENDER) document.body.classList.add("render");
const root = ReactDOM.createRoot(document.getElementById("root"));
const show = (only) => ReactDOM.flushSync(() => root.render(
  only != null ? SLIDES[only](only) : (
    <div id="sheet">{SLIDES.map((S, i) => <div className="thumb" key={i}>{S(i)}</div>)}</div>
  )));

// API Puppeteer : await page.evaluate(n => window.renderSlide(n), n)
const FONTS = ['800 100px "Bricolage Grotesque"', '700 40px "Bricolage Grotesque"', '500 30px "DM Sans"', '700 30px "DM Sans"'];
window.ready = (async () => {
  show(RENDER ? 0 : null);
  await Promise.all(FONTS.map((f) => document.fonts.load(f)));
  await new Promise((r) => { const im = new Image(); im.onload = im.onerror = r; im.src = C.image; });
})();
window.renderSlide = async (n) => { await window.ready; show(n); await new Promise((r) => requestAnimationFrame(() => r())); };
window.SLIDE_COUNT = TOTAL;
</script></body></html>
